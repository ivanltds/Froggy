<!DOCTYPE html>
<html lang="pt-br">

<head>
  <!-- CONFIG -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produto - Froggy Store</title>
  <link rel="icon" type="image/x-icon" href="../IMG/F.png">

  <!-- CSS -->
  <link rel="stylesheet" href="../CSS/produtos.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">

    <!-- LOGO -->
    <section class="logo-container">
      <a href="inicial.html">
        <img alt="logo" src="../IMG/LOGO LETRA AMARELA.png">
      </a>
    </section>

    <!-- NAVBAR -->
    <nav class="navbar">
      <a href="inicial.html#about">SOBRE</a>
      <a href="inicial.html#camisetas">CAMISETAS</a>
      <a href="inicial.html#blusas">BLUSAS</a>
      <a href="inicial.html#tenis">TÊNIS</a>
    </nav>

    <!-- EXTRAS (CARRINHO + USUÁRIO) -->
    <section class="extras-navbar">

      <!-- CARRINHO -->
      <div class="carrinho-box">
        <a href="carrinho.html">
          <img alt="carrinho" class="carrinho" src="../IMG/carrinho.png">
          <span id="contador-carrinho" class="contador">0</span>
        </a>
      </div>

      <!-- USUÁRIO -->
      <div class="usuario-box" id="usuario-box">
        <img alt="usuario" id="img-usuario" class="img-usuario" src="../IMG/usuário.png">
        <span id="iniciais-usuario"></span>

        <!-- DROPDOWN -->
        <div id="dropdown" class="dropdown">
          <button onclick="irPedidos()">Meus Pedidos</button>
          <button onclick="logout()">Sair</button>
        </div>
      </div>

    </section>
  </header>

  <!-- PRODUTO -->
  <main class="produto-container">

    <!-- IMAGEM -->
    <div class="produto-img">
      <img alt="imagem do produto" id="produto-img">
    </div>

    <!-- INFO -->
    <div class="produto-info">
      <h1 id="produto-nome"></h1>
      <p class="descricao" id="produto-desc"></p>
      <p class="preco-produto" id="produto-preco"></p>

      <!-- QUANTIDADE -->
      <div class="quantidade-box">
        <button onclick="diminuirQtd()">-</button>
        <span id="qtd">1</span>
        <button onclick="aumentarQtd()">+</button>
      </div>

      <!-- BOTÃO -->
      <button class="comprar" onclick="comprar()">ADICIONAR AO CARRINHO</button>
    </div>

  </main>

  <!-- RECOMENDADOS -->
  <section class="recomendados">
    <h2>VOCÊ TAMBÉM PODE GOSTAR</h2>
    <div id="lista-recomendados" class="container"></div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <p>Projeto Integrador Multidisciplinar - PIM</p>
    <p>Universidade Paulista (UNIP) - Primeiro Semestre de 2026</p>
    <p>Grupo 1: Matheus Sigoli, Caio Henrique, Bernardo Rodrigues, Antônio Roberto, Franklin Henrique</p>
  </footer>

  <!-- VLIBRAS (COM O JS) -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>   

  <!-- SCRIPTS -->
  <script src="../Javascript/auth.js"></script>
  <script src="../Javascript/usuario.js"></script>
  <script src="../Javascript/produtos.js"></script>

</body>
</html>
