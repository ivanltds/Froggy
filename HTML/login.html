<!DOCTYPE html>
<html lang="pt-br">

<head>
  <!-- CONFIG -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Froggy Store</title>
  <link rel="icon" type="image/x-icon" href="../IMG/F.png">

  <!-- CSS -->
  <link rel="stylesheet" href="../CSS/auth.css">
</head>

<body>

  <!-- CONTAINER -->
  <div class="container">
    <div class="box">

      <!-- LOGO -->
      <img alt="logo" src="../IMG/LOGO LETRA AMARELA.png" class="logo">

      <!-- TÍTULO -->
      <h2>ENTRAR</h2>

      <!-- FORM -->
      <form onsubmit="handleLogin(event)">
        <input type="text" id="email" placeholder="Seu usuário" required>
        <input type="password" id="senha" placeholder="Sua senha" required>
        <button type="submit">Entrar</button>
      </form>

      <!-- LINK -->
      <p class="link">
        Não tem conta? <a href="cadastro.html">Criar conta</a>
      </p>

    </div>
  </div>

  <!-- VLIBRAS (COM O JS) -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>

  <!-- SCRIPT AUTH -->
  <script src="../Javascript/auth.js"></script>

  <!-- SCRIPT LOGIN -->
  <script>
    function handleLogin(e) {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;

      login(email, senha);
    }
  </script>

</body>
</html>
