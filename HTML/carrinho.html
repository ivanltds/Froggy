<!DOCTYPE html>
<html lang="pt-br">

<head>
  <!-- CONFIG -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrinho - Froggy Store</title>
  <link rel="icon" type="image/x-icon" href="../IMG/F.png">

  <!-- CSS -->
  <link rel="stylesheet" href="../CSS/carrinho.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">

    <!-- LOGO -->
    <section class="logo-container">
      <a href="inicial.html">
        <img alt="logo" src="../IMG/LOGO LETRA AMARELA.png">
      </a>
    </section>

    <!-- NAVBAR -->
    <nav class="navbar">
      <a href="inicial.html#about">SOBRE</a>
      <a href="inicial.html#camisetas">CAMISETAS</a>
      <a href="inicial.html#blusas">BLUSAS</a>
      <a href="inicial.html#tenis">TÊNIS</a>
    </nav>

    <!-- EXTRAS -->
    <section class="extras-navbar">

      <!-- CARRINHO -->
      <div class="carrinho-box">
        <a href="carrinho.html">
          <img alt="carrinho" class="carrinho" src="../IMG/carrinho.png">
          <span id="contador-carrinho" class="contador">0</span>
        </a>
      </div>

      <!-- USUÁRIO -->
      <div class="usuario-box" id="usuario-box">
        <img alt="usuario" id="img-usuario" class="img-usuario" src="../IMG/usuário.png">
        <span id="iniciais-usuario"></span>

        <!-- DROPDOWN -->
        <div id="dropdown" class="dropdown">
          <button onclick="irPedidos()">Meus Pedidos</button>
          <button onclick="logout()">Sair</button>
        </div>
      </div>

    </section>
  </header>

  <!-- TÍTULO -->
  <h1 class="titulo">SEU CARRINHO</h1>

  <!-- CONTEÚDO -->
  <main class="carrinho-container">
    <div id="lista-carrinho"></div>

    <div class="resumo">
      <h2>Total: <span id="total">R$ 0,00</span></h2>
      <button onclick="abrirPagamento()" id="finalizar">FINALIZAR COMPRA</button>
    </div>
  </main>

  <!-- POPUP PAGAMENTO -->
  <div id="pagamento-popup" class="popup">
    <div class="popup-box">

      <h2>Escolha o pagamento</h2>

      <!-- BOTÕES -->
      <button onclick="escolherPix()">Pagar com PIX</button>
      <button onclick="escolherCartao()">Pagar com Cartão</button>

      <!-- PIX -->
      <div id="pix-box" class="hidden">
        <h3>Pagamento via PIX</h3>
        <img alt="qrcode" src="../IMG/QR CODE.png" width="200">
        <p>Escaneie o QR Code</p>
        <button onclick="confirmarPagamento()">Confirmar pagamento</button>
      </div>

      <!-- CARTÃO -->
      <div id="cartao-box" class="hidden">
        <h3>Cartão de Crédito</h3>

        <input id="nome-cartao" placeholder="Nome no cartão">
        <input id="numero-cartao" placeholder="0000 0000 0000 0000">
        <input id="validade-cartao" placeholder="MM/AA">
        <input id="cvv-cartao" placeholder="CVV">

        <button onclick="pagarCartao()">Pagar</button>
      </div>

      <!-- AÇÕES -->
      <button onclick="voltarPagamento()">Voltar</button>
      <button onclick="fecharPagamento()">Cancelar</button>

    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <p>Froggy Store 🐸</p>
  </footer>

  <!-- VLIBRAS (COM O JS) -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>
  
  <!-- SCRIPTS -->
  <script src="../Javascript/auth.js"></script>
  <script src="../Javascript/usuario.js"></script>
  <script src="../Javascript/carrinho.js"></script>

</body>
</html>
