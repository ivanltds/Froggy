<!DOCTYPE html>
<html lang="pt-br">

<head>
  <!-- CONFIG -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Pedidos - Froggy Store</title>
  <link rel="icon" type="image/x-icon" href="../IMG/F.png">

  <!-- CSS -->
  <link rel="stylesheet" href="../CSS/pedidos.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">

    <!-- LOGO -->
    <section class="logo-container">
      <a href="inicial.html">
        <img alt="logo" src="../IMG/LOGO LETRA AMARELA.png">
      </a>
    </section>

    <!-- NAVBAR -->
    <nav class="navbar">
      <a href="inicial.html#about">SOBRE</a>
      <a href="inicial.html#camisetas">CAMISETAS</a>
      <a href="inicial.html#blusas">BLUSAS</a>
      <a href="inicial.html#tenis">TÊNIS</a>
    </nav>

    <!-- EXTRAS (CARRINHO + USUÁRIO) -->
    <section class="extras-navbar">

      <!-- CARRINHO -->
      <div class="carrinho-box">
        <a href="carrinho.html">
          <img alt="carrinho" class="carrinho" src="../IMG/carrinho.png">
          <span id="contador-carrinho" class="contador">0</span>
        </a>
      </div>

      <!-- USUÁRIO -->
      <div class="usuario-box" id="usuario-box">
        <img alt="usuario" id="img-usuario" class="img-usuario" src="../IMG/usuário.png">
        <span id="iniciais-usuario"></span>

        <!-- DROPDOWN -->
        <div id="dropdown" class="dropdown">
          <button onclick="irPedidos()">Meus Pedidos</button>
          <button onclick="logout()">Sair</button>
        </div>
      </div>

    </section>
  </header>

  <!-- TÍTULO -->
  <h1 class="titulo">MEUS PEDIDOS</h1>

  <!-- LISTA -->
  <main class="pedidos-container">
    <div id="lista-pedidos"></div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p>Froggy Store 🐸</p>
  </footer>

  <!-- VLIBRAS (COM O JS) -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>

  <!-- SCRIPTS -->
  <script src="../Javascript/auth.js"></script>
  <script src="../Javascript/usuario.js"></script>
  <script src="../Javascript/pedidos.js"></script>

</body>
</html>
